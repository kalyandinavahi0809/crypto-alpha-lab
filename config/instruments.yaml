# qdp instrument master (static reference data).
#
# One entry per (venue, symbol, asset_class). instrument_id is derived as
# "<venue>.<symbol>.<asset_class>" so perps never collide with spot.
#
# Effective dating: every entry is a version with valid_from / valid_to (UTC, ISO dates,
# valid_to exclusive, null = open-ended). Contract changes (tick-size changes, relistings,
# funding-interval changes) are recorded as additional versions. The CLEANED stage appends
# versions it *observes* in the data (price precision -> tick size, funding_interval_hours)
# and logs every change; it never silently overwrites history.
#
# Sources / caveats:
#   * Fees: Binance USD-M VIP0 schedule (maker 2.0 bp, taker 5.0 bp).
#   * Tick sizes and listing dates are cross-checked against the venue's exchangeInfo and the
#     observed price precision during CLEANED.
#   * mmr_brackets below are a FALLBACK: CLEANED replaces them with the tiers the venue
#     publishes (public brackets endpoint) and logs the change. Values here are that venue
#     snapshot (first tiers), used only if the venue is unreachable.
#   * mmr_brackets: [notional_floor_usdt, maintenance_margin_rate]; the maintenance amount
#     ("cum") is derived in code from the bracket table, exactly as Binance defines it.
#   * listing_date: actual venue listing date. data_start is reported from the data itself.

defaults:
  perp:
    multiplier: 1.0
    quote: USDT
    settle: USDT
  spot:
    multiplier: 1.0
    quote: USDT

