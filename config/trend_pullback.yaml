# Trend Pullback + Liquidity Sweep study on USD-M perpetuals.
# Every parameter of the study lives here; code has no strategy constants.

data:
  venue: binance_usdm          # venue adapter (venue-agnostic; swap for another registered adapter)
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT]
  intervals: [1h, 4h]          # tested independently
  spot_interval: 1d            # spot benchmark (buy-and-hold) only
  start_month: null            # null = from the first month the venue publishes (listing / archive start)
  end_month: "2026-09"         # last complete month with klines + mark + funding published
  # Open interest is intentionally not ingested: out of scope for this test.

features:
  atr_n: 14
  swing_k: [2, 3, 5]           # fractal half-width; a swing at bar t is known only at t+k
  bos_close: [true, false]     # true = rule (close beyond the swing); false = wick ablation
  zone_base_max_bars: 1        # last opposite-close candle (N>1 allows a base of up to N bars)
  zone_lookback_bars: 10       # how far back from the impulse origin to look for that candle
  stop_atr_buffer: 0.1         # stop = zone far edge -/+ 0.1 x ATR(14)
  causality_audit: {bars: 6000, cuts: 8}

simulation:
  initial_equity: 100000
  risk_per_trade: 0.005        # fixed 0.5% of equity between entry fill and stop
  max_leverage: 5.0            # isolated margin = notional / max_leverage (capped at equity)
  liq_policy: delever          # liquidation inside the stop -> raise margin if equity allows, else reject (both counted)
  through_ticks: 1             # limit orders (entries and take-profits) must trade through by >= 1 tick
  slippage_bps: 2.0            # stop / market / end-of-data fills (base case)
  slippage_sensitivity_bps: [1.0, 3.0]
  stress_slippage_mult: 2.0    # extra stress run at 2x base slippage
  intrabar: pessimistic        # stop fills first when stop and target share a bar; optimistic also reported
  trail_atr_buffer: 0.1        # swing-trail stop = latest confirmed swing -/+ 0.1 x ATR
